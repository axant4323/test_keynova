name: Keynova Post-Quantum Cryptographic Readiness Gate

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  pqc-security-gate:
    name: Air-Gapped PQC Readiness Gate & CBOM Exporter
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache Keynova AST Cache
        uses: actions/cache@v4
        with:
          path: .keynova_cache
          key: keynova-cache-${{ runner.os }}-${{ hashFiles('**/*.py') }}
          restore-keys: |
            keynova-cache-${{ runner.os }}-

      - name: Clone Keynova Autonomous Security Engine
        run: |
          git clone --depth 1 https://github.com/ManviAnchan/Nexathon_Spark.git ../keynova_engine

      - name: Install Keynova Scanner Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f ../keynova_engine/backend/requirements.txt ]; then
            pip install -r ../keynova_engine/backend/requirements.txt
          fi

      - name: Execute Keynova PQC Readiness Policy Gate
        id: keynova_gate
        env:
          PYTHONPATH: ../keynova_engine/backend
        run: |
          mkdir -p reports
          python -m keynova.cli service \
            --min-score 80 \
            --block-hndl \
            --export-sarif reports/keynova-results.sarif \
            --output reports/keynova-evaluation.json \
            --step-summary

      - name: Generate CycloneDX 1.6 Cryptographic Bill of Materials (CBOM)
        if: always()
        env:
          PYTHONPATH: ../keynova_engine/backend
        run: |
          python -c "
          import json
          from pathlib import Path
          from keynova.cli.main import scan_directory
          from keynova.services.exporters.cbom import generate_cyclonedx_cbom

          findings, report = scan_directory(Path('service'))
          cbom = generate_cyclonedx_cbom(
              project_name='${{ github.repository }}',
              scan_id='${{ github.sha }}',
              findings=findings,
              readiness_score=report.get('readiness_score', 0)
          )
          with open('reports/cyclonedx-cbom.json', 'w') as f:
              json.dump(cbom, f, indent=2)
          print('[CBOM] CycloneDX 1.6 Cryptographic BOM exported successfully.')
          "

      - name: Upload CycloneDX CBOM Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: keynova-cyclonedx-cbom
          path: reports/cyclonedx-cbom.json
          retention-days: 14

      - name: Upload SARIF Security Scan Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: keynova-sarif-report
          path: reports/keynova-results.sarif
          retention-days: 14
